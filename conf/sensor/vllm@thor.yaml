###
### 02.08.2026
### vLLM metrics from thor:8000 (numeric only)
###

  - platform: prometheus_sensor
    url: http://prometheus-ui.prometheus-system.svc.turingpi:9090
    queries:
      - name: vllm@thor_tokens_prompt_total_qwen36
        unique_id: vllm_thor_tokens_prompt_total_qwen36
        unit_of_measurement: tokens
        state_class: total_increasing
        expr: vllm:prompt_tokens_total{engine="0",model_name="qwen3.6"}

      - name: vllm@thor_tokens_prompt_total_qwen38
        unique_id: vllm_thor_tokens_prompt_total_qwen38
        unit_of_measurement: tokens
        state_class: total_increasing
        expr: vllm:prompt_tokens_total{engine="0",model_name="qwen3.8"}

      - name: vllm@thor_tokens_prompt_total_qwen25_coder
        unique_id: vllm_thor_tokens_prompt_total_qwen25_coder
        unit_of_measurement: tokens
        state_class: total_increasing
        expr: vllm:prompt_tokens_total{engine="0",model_name="qwen2.5-coder"}

      - name: vllm@thor_tokens_prompt_total_qwen3_routing_classifier
        unique_id: vllm_thor_tokens_prompt_total_qwen3_routing_classifier
        unit_of_measurement: tokens
        state_class: total_increasing
        expr: vllm:prompt_tokens_total{engine="0",model_name="qwen3-routing-classifier"}

      - name: vllm@thor_tokens_generation_total_qwen36
        unique_id: vllm_thor_tokens_generation_total_qwen36
        unit_of_measurement: tokens
        state_class: total_increasing
        expr: vllm:generation_tokens_total{engine="0",model_name="qwen3.6"}

      - name: vllm@thor_tokens_generation_total_qwen38
        unique_id: vllm_thor_tokens_generation_total_qwen38
        unit_of_measurement: tokens
        state_class: total_increasing
        expr: vllm:generation_tokens_total{engine="0",model_name="qwen3.8"}

      - name: vllm@thor_tokens_generation_total_qwen25_coder
        unique_id: vllm_thor_tokens_generation_total_qwen25_coder
        unit_of_measurement: tokens
        state_class: total_increasing
        expr: vllm:generation_tokens_total{engine="0",model_name="qwen2.5-coder"}

      - name: vllm@thor_tokens_generation_total_qwen3_routing_classifier
        unique_id: vllm_thor_tokens_generation_total_qwen3_routing_classifier
        unit_of_measurement: tokens
        state_class: total_increasing
        expr: vllm:generation_tokens_total{engine="0",model_name="qwen3-routing-classifier"}

      - name: vllm@thor_tps_prompt_qwen36
        unique_id: vllm_thor_tps_prompt_qwen36
        unit_of_measurement: tps
        expr: round(irate(vllm:prompt_tokens_total{engine="0",model_name="qwen3.6"}[1m]), 0.01)

      - name: vllm@thor_tps_prompt_qwen38
        unique_id: vllm_thor_tps_prompt_qwen38
        unit_of_measurement: tps
        expr: round(irate(vllm:prompt_tokens_total{engine="0",model_name="qwen3.8"}[1m]), 0.01)

      - name: vllm@thor_tps_prompt_qwen25_coder
        unique_id: vllm_thor_tps_prompt_qwen25_coder
        unit_of_measurement: tps
        expr: round(irate(vllm:prompt_tokens_total{engine="0",model_name="qwen2.5-coder"}[1m]), 0.01)

      - name: vllm@thor_tps_prompt_qwen3_routing_classifier
        unique_id: vllm_thor_tps_prompt_qwen3_routing_classifier
        unit_of_measurement: tps
        expr: round(irate(vllm:prompt_tokens_total{engine="0",model_name="qwen3-routing-classifier"}[1m]), 0.01)

      - name: vllm@thor_tps_generation_qwen36
        unique_id: vllm_thor_tps_generation_qwen36
        unit_of_measurement: tps
        expr: round(irate(vllm:generation_tokens_total{engine="0",model_name="qwen3.6"}[1m]), 0.01)

      - name: vllm@thor_tps_generation_qwen38
        unique_id: vllm_thor_tps_generation_qwen38
        unit_of_measurement: tps
        expr: round(irate(vllm:generation_tokens_total{engine="0",model_name="qwen3.8"}[1m]), 0.01)

      - name: vllm@thor_tps_generation_qwen25_coder
        unique_id: vllm_thor_tps_generation_qwen25_coder
        unit_of_measurement: tps
        expr: round(irate(vllm:generation_tokens_total{engine="0",model_name="qwen2.5-coder"}[1m]), 0.01)

      - name: vllm@thor_tps_generation_qwen3_routing_classifier
        unique_id: vllm_thor_tps_generation_qwen3_routing_classifier
        unit_of_measurement: tps
        expr: round(irate(vllm:generation_tokens_total{engine="0",model_name="qwen3-routing-classifier"}[1m]), 0.01)

  - platform: statistics
    name: vllm@thor_tps_prompt_qwen36_max24h
    unique_id: vllm_thor_tps_prompt_qwen36_max24h
    entity_id: "sensor.vllm_thor_tps_prompt_qwen36"
    state_characteristic: value_max
    sampling_size: 5760
    max_age:
        hours: 24

